<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Contact Information</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎓 StudentHub</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="events.html">Events</a>
            <a href="result.html">Results</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Contact Information</h2>

        <form action="#" method="post">
            <label for="studentname">Student Name</label>
            <input type="text" id="studentname" name="studentname" required>

            <label for="enrollment">Enrollment Number</label>
            <input type="text" id="enrollment" name="enrollment" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile">

            <label for="address">Address</label>
            <textarea id="address" name="address" rows="4"></textarea>

            <label for="emergencyname">Emergency Contact Name</label>
            <input type="text" id="emergencyname" name="emergencyname">

            <label for="emergencynumber">Emergency Contact Number</label>
            <input type="tel" id="emergencynumber" name="emergencynumber">

            <input type="submit" value="Save">
            <input type="reset" value="Clear">
        </form>

        <p>
            <a href="result.html">Previous</a> |
            <a href="index.html">Home</a>
        </p>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub Portal</p>
    </footer>
</body>
</html>
