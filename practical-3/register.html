<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub | Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎓 StudentHub</h1>
        <p>Create Your Student Account</p>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html" aria-current="page">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Student Registration</h2>

        <form action="#" method="post">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" autocomplete="name" required>

            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" name="studentId"
                   placeholder="Enter your student ID" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" autocomplete="email" required>

            <label for="phone">Mobile Number</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your mobile number"
                   autocomplete="tel" required>

            <label for="department">Department</label>
            <select id="department" name="department" required>
                <option value="">Select your department</option>
                <option value="IT">Information Technology</option>
                <option value="CE">Computer Engineering</option>
                <option value="CSE">Computer Science</option>
                <option value="Other">Other</option>
            </select>

            <label for="semester">Semester</label>
            <select id="semester" name="semester" required>
                <option value="">Select semester</option>
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="6">Semester 6</option>
                <option value="7">Semester 7</option>
                <option value="8">Semester 8</option>
            </select>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Create a password"
                   autocomplete="new-password" minlength="8" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   placeholder="Re-enter your password"
                   autocomplete="new-password" minlength="8" required>

            <input type="submit" value="Create Account">
            <input type="reset" value="Clear Form">

            <p>Already registered? <a href="login.html">Login here</a></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub Portal. All rights reserved.</p>
    </footer>
</body>
</html>
